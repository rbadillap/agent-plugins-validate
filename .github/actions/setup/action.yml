name: Set up
description: Install Node 24 and the dependencies from package-lock.json.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - run: make install
      shell: bash
