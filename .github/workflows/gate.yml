name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      schemas: ${{ steps.areas.outputs.schemas }}
      workflows: ${{ steps.areas.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          # A new branch (all zeros) or a force-push (base not reachable) runs every area.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit: running every area."
            all=true
            files=""
          else
            all=false
            files=$(git diff --name-only "$base" "$HEAD_SHA")
            echo "Changed files:"
            echo "$files"
          fi
          area() {
            if [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          area code '^(src/|fixtures/|schemas/|dist/)|^(package\.json|package-lock\.json|tsconfig\.json|biome\.json|Makefile|\.npmrc|\.gitattributes)$|^\.github/(actions/setup/|workflows/(test-code|gate)\.yml$)'
          area schemas '^(schemas/|\.github/workflows/check-schemas\.yml$)'
          area workflows '^(\.github/|action\.yml$)'

  code:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: $/.github/workflows/test-code.yml

  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    uses: $/.github/workflows/check-schemas.yml

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: $/.github/workflows/audit-workflows.yml

  gate:
    if: always()
    needs: [changes, code, schemas, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any area failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A skipped area counts as passed.
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            exit 1
          fi
