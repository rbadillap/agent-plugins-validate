name: release

# Started by hand, from the default branch. It checks the code, attests dist/index.js, creates the
# tag and the release, and moves the major tag. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, like 1.2.0 (no leading v, no pre-release)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version and where this runs
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=version::\"$VERSION\" is not a version like 1.2.0 (three numbers, no leading v, no pre-release)."
            exit 1
          fi
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error title=branch::Releases are made from the default branch ($DEFAULT_BRANCH), not from $REF."
            exit 1
          fi
          if [ "$(jq -r .version package.json)" != "$VERSION" ]; then
            echo "::error title=package.json::The version in package.json must be $VERSION before it is released: the Action reports it in every report."
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error title=tag::The tag v$VERSION already exists. A release tag never moves."
            exit 1
          fi
          # No "|| true" around the listing: if GitHub can't answer, the release stops.
          tags="$(gh release list --repo "$REPO" --limit 200 --json tagName --jq '.[].tagName')"
          latest="$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            echo "This is the first release: v$VERSION." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            highest="$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)"
            if [ "$highest" != "$VERSION" ] || [ "$latest" = "$VERSION" ]; then
              echo "::error title=version::$VERSION is not greater than the latest release, $latest."
              exit 1
            fi
            echo "Releasing v$VERSION after v$latest." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: $/.github/actions/setup
      - run: make lint
      - run: make test
      - run: make check-dist

  attest:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/index.js

  publish:
    needs: [verify, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Tags are made through the REST API, not with git push: no job here keeps a credential in
      # the checkout, and none needs one.
      - name: Create the tag, publish the release, move the major tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"
          gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$SHA" > /dev/null
          # A draft first, published last, so the release is complete when it becomes immutable.
          gh release create "v$VERSION" --repo "$REPO" --verify-tag --draft --generate-notes --title "v$VERSION"
          gh release edit "v$VERSION" --repo "$REPO" --draft=false --latest
          if gh api "repos/$REPO/git/ref/tags/v$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/v$major" -f "sha=$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/v$major" -f "sha=$SHA" > /dev/null
          fi
          {
            echo "Released v$VERSION at $SHA."
            echo "The tag v$major points at the same commit."
          } >> "$GITHUB_STEP_SUMMARY"
